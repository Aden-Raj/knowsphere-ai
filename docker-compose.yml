services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowsphere}
      POSTGRES_USER: ${POSTGRES_USER:-knowsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowsphere} -d ${POSTGRES_DB:-knowsphere}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
