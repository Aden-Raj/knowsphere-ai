[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowsphere-api"
version = "0.1.0"
description = "API foundation for KnowSphere AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "chromadb>=1.5,<2.0",
  "sentence-transformers>=6.2,<7.0",
  "PyMuPDF>=1.26.7,<2.0",
  "python-docx>=1.2,<2.0",
  "httpx>=0.28,<1.0",
  "langgraph>=1.2,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "alembic>=1.14,<2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_model: uses the real Sentence Transformers model and may download it"]

[tool.ruff]
line-length = 100
target-version = "py312"
